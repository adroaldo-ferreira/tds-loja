<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Página não encontrada</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        .error {
            font-size: 140px;
            font-weight: 800;
            line-height: 1;
            color: #2563eb;
            letter-spacing: -8px;
        }

        h1 {
            margin-top: 20px;
            font-size: 32px;
            color: #111827;
        }

        p {
            margin: 15px 0 30px;
            font-size: 18px;
            line-height: 1.6;
            color: #6b7280;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
        }

        .button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        @media (max-width: 500px) {
            .error {
                font-size: 100px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <div class="icon">🔎</div>

    <div class="error">404</div>

    <h1>Página não encontrada</h1>

    <p>
        Ops! A página que você está procurando não existe,
        foi removida ou o endereço está incorreto.
    </p>

    <a href="/" class="button">
        Voltar para o início
    </a>

</main>

</body>
</html>
