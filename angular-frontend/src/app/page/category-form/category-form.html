<div class="container">
  <label for="nome">Informe o Nome</label>
  <input type="text" alt="Informe o nome" [(ngModel)]="name" id="nome">
  <label for="descricao">Informe a descrição</label>
  <input type="text" alt="Informe o nome" [(ngModel)]="description" id="descricao">
  <input type="button" value="Salvar" class="btn btn-primary" (click)="salvar()">
</div>
